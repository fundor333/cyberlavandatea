name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Force a bump type instead of inferring it from Conventional Commits"
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # A bot-authored push must NOT be made with GITHUB_TOKEN, or it
          # won't trigger other workflows (CI, Pages). Use a PAT if one is
          # configured; otherwise fall back to GITHUB_TOKEN (release still
          # works, CI/Pages just won't re-run for the bump commit).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Install git-cliff
        uses: taiki-e/install-action@git-cliff

      - name: Determine next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.0)"

          if [ -z "$(git log "$LAST_TAG"..HEAD --oneline)" ]; then
            echo "No commits since $LAST_TAG, nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$BUMP" = "auto" ] || [ -z "$BUMP" ]; then
            VERSION="$(git-cliff --bumped-version | sed 's/^v//')"
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "${LAST_TAG#v}"
            case "$BUMP" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="$MAJOR.$((MINOR + 1)).0" ;;
              patch) VERSION="$MAJOR.$MINOR.$((PATCH + 1))" ;;
              *) echo "Unknown bump type: $BUMP" >&2; exit 1 ;;
            esac
          fi

          echo "Cutting release v$VERSION (${BUMP:-auto} bump from $LAST_TAG)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Update CHANGELOG.md, release notes and package.json
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git-cliff --tag "v$VERSION" -o CHANGELOG.md
          printf '%s\n' "$(cat CHANGELOG.md)" > CHANGELOG.md
          git-cliff --tag "v$VERSION" --unreleased --strip header -o release-notes.md
          node -e "
            const fs = require('fs');
            const pkg = require('./package.json');
            pkg.version = process.env.VERSION;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Commit version bump
        if: steps.version.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md package.json
          git commit -m "chore(release): v${VERSION}"
          git tag "v${VERSION}"
          git push origin HEAD:main
          git push origin "v${VERSION}"

      - name: Create GitHub release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release-notes.md
