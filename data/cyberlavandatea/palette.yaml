# CyberLavandaTea palette — reference (the source of truth is assets/scss/_tokens.scss @theme).
# Dark-only, 6 roles + one green + one blue. Contrast ratios are against Background #14151A.
roles:
  primary:    { hex: "#5FD88F", role: "green — accent, hover, focus, keyword",       contrast: "10.2:1 (AAA)" }
  content:    { hex: "#E6E6EC", role: "text, headings, strong, code text",           contrast: "14.7:1 (AAA)" }
  link:       { hex: "#4D9FFF", role: "blue — unvisited links, strings",             contrast: "6.7:1 (AA)" }
  visited:    { hex: "#7EA88E", role: "sage — visited links",                        contrast: "6.8:1 (AA)" }
  background: { hex: "#14151A", role: "body, navbar, footer" }
  inactive:   { hex: "#8B8F9A", role: "meta, dates, borders, placeholders, comments", contrast: "5.6:1 (AA)" }
derived:
  surface:  "#25262B"  # Content @ 8% over Background — code/pre/toc/blockquote
  border:   "#313237"  # Content @ 14% over Background — hr, separators
syntax:
  fn:  "#A8C9FF"  # light tint of link
  num: "#8FE0AF"  # light tint of primary
  err: "#FF6F6F"  # red, the only extra hue, inside <pre> only
fonts:
  display: "Audiowide"        # headings, links, strong, footer
  body: "Rajdhani"            # body text
  signature: "Sig Font"       # .written-by-human — set via params.fonts.signature, cursive fallback otherwise
